# Twice a week: drive the live site in headless Chrome (every page, the sample clip through
# transcription, cutting and export, and the upload path at phone size), and check the live build
# isn't stale. A stale build (the scheduled deploys didn't run) starts a deploy; a failed check
# opens or updates an issue labelled self-test, and the next passing run closes it. It only reads
# the live site, so it can never take the site down, and it is safe to re-run.
name: Live self-test

on:
  schedule:
    - cron: "47 7 * * 3"
    - cron: "53 8 * * 6"
    # TEMPORARY, self-limiting (22-23 November only): proves the schedule trigger fires on this
    # account. Remove after the first scheduled run passes (OPERATIONS.md).
    - cron: "29 */2 22,23 11 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Staleness check (start a deploy if the live build is over 8 days old)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(curl -fsS "$SITE_URL/build.json?$RANDOM" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).built)}catch{console.log("")}})') || built=""
          if [ -z "$built" ]; then echo "::warning::Couldn't read $SITE_URL/build.json"; exit 0; fi
          age=$(( ( $(date +%s) - $(date -d "$built" +%s) ) / 86400 ))
          echo "live build: $built ($age days old)"
          if [ "$age" -gt 8 ]; then
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
            if [ "$busy" = "0" ]; then gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
            echo "::warning::The live build was $age days old; started Deploy site."
          fi
      - name: Make sure Chrome is installed
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tee "$RUNNER_TEMP/chrome.txt"
            echo "CHROME=$(tail -1 "$RUNNER_TEMP/chrome.txt" | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          fi
      - run: npm ci --no-audit --no-fund
      - name: Self-test the live site
        id: selftest
        run: node scripts/selftest.mjs --url "$SITE_URL/" --report report.json --max-age-days 16
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-selftest-report
          path: report.json
          retention-days: 60
      - name: Open, update or close the self-test issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.selftest.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create self-test --color B60205 --description "Live self-test of the site" 2>/dev/null || true
          open=$(gh issue list --label self-test --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Passing again: $RUN_URL"; fi
            exit 0
          fi
          failed=$(node -e 'try{const r=require("./report.json");console.log(r.checks.filter(c=>!c.pass).map(c=>"- "+c.name+(c.detail?" ("+c.detail.slice(0,300)+")":"")).join("\n")||"- the self-test did not finish")}catch{console.log("- the self-test did not produce a report")}')
          body=$(printf "The live self-test of %s failed on %s.\n\nFailed checks:\n%s\n\nRun: %s\n\nThe site itself is unchanged: this job only reads it. See OPERATIONS.md, \"When the live self-test fails\"." "$SITE_URL" "$(date -u +%Y-%m-%d)" "$failed" "$RUN_URL")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Live self-test failing" --label self-test --body "$body"; fi
      - name: Library updates waiting (for the next maintenance session; never fails)
        if: always()
        run: |
          for p in mediabunny @mediabunny/aac-encoder @huggingface/transformers onnxruntime-web; do
            have=$(node -e "console.log(require('./package.json').devDependencies['$p'] || require('./node_modules/$p/package.json').version)")
            latest=$(npm view "$p" version 2>/dev/null || echo "?")
            if [ "$latest" != "?" ] && [ "$latest" != "$have" ]; then echo "- $p: $have in use, $latest available" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "Upgrade steps: OPERATIONS.md, \"Updating the libraries and models\"." >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/keepalive.sh
